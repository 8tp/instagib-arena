<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Quake-style instagib in the browser. One shot, one kill. Movement is the skill ceiling."
    />
    <title>Instagib Arena</title>

    <!-- Social link previews: a pasted invite / share link renders as a game,
         not a naked URL. og-image.png lives in /public (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Instagib Arena" />
    <meta property="og:title" content="Instagib Arena — one shot, one kill" />
    <meta
      property="og:description"
      content="Quake-style instagib in the browser. The railgun always kills — so the whole game is aim and movement. Strafe, dash, double-jump, wall-jump. Play free, no download."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instagib Arena — one shot, one kill" />
    <meta
      name="twitter:description"
      content="Browser FPS. One railgun, one shot, pure aim + movement. Play free in your browser."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist+Mono:wght@400..600&family=Geist:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
