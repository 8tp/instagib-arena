name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The large client may carry lint warnings; surface them without
      # failing the build.
      - run: npm run lint
        continue-on-error: true
